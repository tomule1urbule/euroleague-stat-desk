  if (t.hasAttribute("data-mt-asked")) { mtWithEntry(e => { e.asked = true; }); return paintBoard(); }
  if (t.dataset.mtrnav) { const rs = mtRounds(); MT.round = rs[rs.indexOf(MT.round) + +t.dataset.mtrnav] || MT.round; MT.sel = null; return renderMyTeam({ fresh: true }); }
  if (t.hasAttribute("data-mt-backup")) return openTeamBackup();
  if (t.hasAttribute("data-mt-copy")) { const ta = $("#mt-code"); navigator.clipboard?.writeText(ta.value).then(() => { t.textContent = "Copied"; }, () => { ta.focus(); ta.select(); t.textContent = "Select and copy the text"; }) ?? (ta.focus(), ta.select()); return; }
  if (t.hasAttribute("data-mt-restore")) return mtRestore();
  if (t.hasAttribute("data-mt-refresh")) { t.disabled = true; t.textContent = "Refreshing…"; pollLive().then(() => renderMyTeam()); return; }
});
document.addEventListener("input", (ev) => { if (ev.target.id === "mt-search") { MT.q = ev.target.value; paintResults(); } });

/* ================= standings ================= */
const formHtml = (f) => `<span class="form">${(f || []).map(x => `<i class="${esc(x)}">${esc(x)}</i>`).join("")}</span>`;
async function renderStandings() {
  $("#main").innerHTML = '<div class="loading">Loading standings…</div>';
  let st; try { st = await loadStandings(); } catch (e) { return showError(e); }
  if (S.tab !== "standings") return;
  $("#main").innerHTML = `<div class="sec-h"><h2>Standings</h2><span class="sub">After round ${st.round}${st.computed ? " · calculated from results" : ""}</span></div>
    <div class="tframe"><table><thead><tr><th>Team</th><th>GP</th><th>W</th><th>L</th><th>Win%</th><th>PF</th><th>PA</th><th>Diff</th><th>Home</th><th>Away</th><th class="l">Last 5</th></tr></thead><tbody>
    ${st.teams.map(t => `<tr><td><div class="pn"><span class="zone ${t.position <= 6 ? "po" : t.position <= 10 ? "pi" : ""}">${t.position}</span><img class="crest" src="${esc(t.club.images?.crest)}" alt=""><b>${esc(t.club.name)}</b></div></td><td>${t.gamesPlayed}</td><td class="key">${t.gamesWon}</td><td>${t.gamesLost}</td><td>${esc(t.winPercentage)}</td><td>${t.pointsFor}</td><td>${t.pointsAgainst}</td><td class="${String(t.pointsDifference).startsWith("-") ? "negv" : "pos"}">${esc(t.pointsDifference)}</td><td>${esc(t.homeRecord)}</td><td>${esc(t.awayRecord)}</td><td class="l">${formHtml(t.last5Form)}</td></tr>`).join("")}
    </tbody></table></div>
    <div class="legend"><span><span class="zone po">1</span> Playoffs (1–6)</span><span><span class="zone pi">7</span> Play-in (7–10)</span></div>${st.computed ? '<p class="note">The official standings didn\'t load, so this table is calculated from game results. Teams level on wins are ordered by point difference, which can differ from the official tiebreakers.</p>' : ""}`;
}

/* ================= connection test ================= */
// For each address: a normal request (what the app does) and a "no-cors" probe. If the probe gets through but the
// normal request fails, the server answered but its reply was unusable (e.g. a protection page or rate limit).
async function probe(url, mode) {
  const ac = new AbortController(), t0 = performance.now(), timer = setTimeout(() => ac.abort(), 12000);
  try {
    const r = await fetch(url, { mode, cache: "no-store", signal: ac.signal });
    let size = "";
    if (mode === "cors") { const b = await r.text(); size = ` · ${Math.round(b.length / 1024)} KB`; }
    return { ok: mode === "cors" ? r.ok : true, msg: mode === "cors" ? `HTTP ${r.status}${size}` : "reachable", ms: Math.round(performance.now() - t0) };
  } catch (e) { return { ok: false, msg: e.name === "AbortError" ? "timed out after 12 s" : `${e.name}: ${e.message}`, ms: Math.round(performance.now() - t0) }; }
  finally { clearTimeout(timer); }
}
async function runConnTest() {
  const out = $("#conn-out"); if (!out) return;
  const tests = [
    ["EuroLeague stats server", `${HOSTS.api}/v2/competitions/${COMP}/seasons/${COMP}${NOW_SEASON}/games?roundNumber=1`],
    ["EuroLeague live feed", `${HOSTS.live}/api/Header?gamecode=1&seasoncode=${COMP}${NOW_SEASON}`],
    ["Control (GitHub)", "https://api.github.com/zen"],
  ];
  const lines = [`Silkiu Magnatai connection test · ${new Date().toISOString()}`, `Online: ${navigator.onLine} · Network: ${navigator.connection?.effectiveType || "unknown"}`, `Browser: ${navigator.userAgent}`, ""];
  const rows = [];
  out.innerHTML = '<div class="loading">Testing… this takes up to 30 seconds.</div>';
  for (const [name, url] of tests) {
    const a = await probe(url, "cors"); let b = null, verdict;
    if (a.ok) verdict = "Working";
    else if (/^HTTP \d/.test(a.msg)) verdict = `Server refused the request (${a.msg.split(" ·")[0]})`;
    else { b = await probe(url, "no-cors"); verdict = b.ok ? "Server answered, but the browser blocked the reply" : "Could not connect at all"; }
    rows.push({ name, a, b, verdict });
    lines.push(`${name}: ${verdict} | normal: ${a.msg} (${a.ms} ms)${b ? ` | probe: ${b.msg} (${b.ms} ms)` : ""}`);
  }
  const report = lines.join("\n");
  out.innerHTML = `<div class="tframe" style="box-shadow:none"><table class="rules"><tbody>${rows.map(r => `<tr><td><b>${esc(r.name)}</b><br><span class="sub">${esc(r.a.msg)} · ${r.a.ms} ms</span></td><td class="${r.a.ok ? "pos" : "negv"}" style="width:auto;white-space:normal">${esc(r.verdict)}</td></tr>`).join("")}</tbody></table></div>
    <p class="note">Send the report below to whoever maintains the app.</p>
    <textarea id="conn-report" class="input" readonly rows="7" style="width:100%;font:12px/1.4 ui-monospace,monospace;margin-top:8px">${esc(report)}</textarea>
    <div class="row" style="margin-top:10px"><button class="btn primary" data-copyreport>Copy report</button><button class="btn" data-conntest>Run again</button></div>`;
}
function openConnTest() {
  openGameCode = null;
  sheet("Connection test", `<section class="card box"><h3>Connection test</h3><p class="sub" style="margin-top:-4px">Checks whether this phone can reach the EuroLeague servers right now, and what kind of problem it is if not.</p><div id="conn-out"></div></section>`, openConnTest);
  runConnTest();
}

/* ================= info sheet ================= */
function openInfo() {
  openGameCode = null;
  sheet("Fantasy Points", `<section class="card box"><h3>How Fantasy Points are counted</h3><p class="sub" style="margin-top:-4px">Every game, for every player who gets on the court.</p>
    <div class="tframe" style="box-shadow:none"><table class="rules"><tbody>${FP_RULES.map(([k, v]) => `<tr><td>${esc(k)}</td><td class="${v.startsWith("+") ? "pos" : "negv"}">${v}</td></tr>`).join("")}</tbody></table></div>
    <p class="note" style="margin-bottom:12px">Having trouble loading data? <button class="btn" data-conntest style="margin-left:6px">Run connection test</button></p><p class="note">Only the highest multi-double bonus counts (a triple-double earns +30, not +40). The win or loss bonus is added once the game is final. Season Fantasy Points are the sum over every finished game.</p></section>`, openInfo);
}

/* ================= events ================= */
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-refreshgame],[data-conntest],[data-copyreport],[data-retry],[data-tab],[data-game],[data-player],[data-mode],[data-sort],[data-sortby],[data-close],[data-back],[data-info],[data-hist],[data-histmore],[data-h2h],[data-rnav]");
  if (!t) return;
  if (t.dataset.refreshgame) return refreshGameNow(+t.dataset.refreshgame, t);
  if (t.hasAttribute("data-conntest")) return $("#conn-out") ? runConnTest() : openConnTest();
  if (t.hasAttribute("data-copyreport")) {
    const ta = $("#conn-report"); if (!ta) return;
    navigator.clipboard?.writeText(ta.value).then(() => { t.textContent = "Copied"; }, () => { ta.focus(); ta.select(); t.textContent = "Select and copy the text"; })
      ?? (ta.focus(), ta.select());
    return;
  }
  if (t.hasAttribute("data-retry")) { if (!S.games.length || S.staleKeys.size) return loadSeason(); S.standings = null; return render(); }
  if (t.hasAttribute("data-close")) { if (e.target === t || t.tagName === "BUTTON") closeSheet(); return; }
  if (t.hasAttribute("data-histmore")) return renderHistory(t.dataset.histmore, t.dataset.opp, +t.dataset.back);
  if (t.hasAttribute("data-back")) return back();
  if (t.hasAttribute("data-info")) return openInfo();
  if (t.dataset.tab) { S.tab = t.dataset.tab; try { localStorage.setItem("sm-tab", S.tab); } catch (x) {} closeSheet(); window.scrollTo(0, 0); return render(); }
  if (t.dataset.rnav) { const rounds = [...new Set(S.games.map(roundKey))]; S.round = rounds[rounds.indexOf(S.round) + +t.dataset.rnav] || S.round; return renderGames(); }
  if (t.dataset.h2h) return renderH2H(+t.dataset.h2h);
  if (t.dataset.hist) return renderHistory(t.dataset.hist, $("#hopp").value, HISTORY_SEASONS);
  if (t.dataset.game) return openGame(+t.dataset.game);
  if (t.dataset.player) return openPlayer(t.dataset.player, { opp: t.dataset.opp, auto: !!t.dataset.auto });
  if (t.dataset.mode) { S.mode = t.dataset.mode; return render(); }
  if (t.dataset.sort) { const k = t.dataset.sort; S.sort = S.sort.key === k ? { key: k, asc: !S.sort.asc } : { key: k, asc: k === "name" || k === "team" }; return renderPlayers(); }
  if (t.dataset.sortby) { S.sort = { key: t.dataset.sortby, asc: false }; S.tab = "players"; return render(); }
});
document.addEventListener("input", (e) => { if (e.target.id === "psearch") { S.search = e.target.value; renderPlayers(); } });
document.addEventListener("change", (e) => {
  if (e.target.id === "pteam") { S.team = e.target.value; renderPlayers(); }
  if (e.target.id === "season") { S.season = +e.target.value; closeSheet(); loadSeason(); }
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeSheet(); });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && S.games.length) tick(); });

$("#season").innerHTML = SEASONS.map(y => `<option value="${y}">${seasonLabel(y)}</option>`).join("");
loadSeason();
</script>
