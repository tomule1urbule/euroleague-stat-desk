<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1b2a">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Silkiu Magnatai">
<title>Silkiu Magnatai Fantasy Analytics App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@600;700&display=swap">
<style>
/* Layout: brand header + tabs (bottom bar on phones); one working panel per tab; detail opens in a side sheet. Gold = Fantasy Points everywhere. */
:root{
  --bg:#eef2f6; --surface:#ffffff; --surface-2:#f5f7fa; --line:#e2e8ef; --line-2:#d3dbe5;
  --ink:#0d1b2a; --muted:#64748b; --sea:#1d5fd1; --sea-soft:#e7effc;
  --gold:#a8700f; --gold-bright:#e3a72f; --gold-soft:#fdf2db;
  --live:#e02d3c; --win:#15924a; --loss:#d63a3a;
  --shadow:0 1px 2px rgba(13,27,42,.05),0 8px 24px -8px rgba(13,27,42,.12); --hdr:#0d1b2a; --on-sea:#ffffff;
  --radius:16px;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --ui:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#09101b; --surface:#111a28; --surface-2:#172236; --line:#1f2c42; --line-2:#2a3a55;
  --ink:#e9eef6; --muted:#8fa1b8; --sea:#6ea6ff; --sea-soft:rgba(110,166,255,.12);
  --gold:#f3c04f; --gold-bright:#f3c04f; --gold-soft:rgba(243,192,79,.13);
  --live:#ff4d5e; --win:#3fd58a; --loss:#ff6b6b;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 10px 30px -12px rgba(0,0,0,.6); --hdr:#0d1726; --on-sea:#06142b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#09101b; --surface:#111a28; --surface-2:#172236; --line:#1f2c42; --line-2:#2a3a55;
  --ink:#e9eef6; --muted:#8fa1b8; --sea:#6ea6ff; --sea-soft:rgba(110,166,255,.12);
  --gold:#f3c04f; --gold-bright:#f3c04f; --gold-soft:rgba(243,192,79,.13);
  --live:#ff4d5e; --win:#3fd58a; --loss:#ff6b6b;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 10px 30px -12px rgba(0,0,0,.6); --hdr:#0d1726; --on-sea:#06142b; color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--ui);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top,0px)}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sea);outline-offset:2px;border-radius:6px}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
img.crest{object-fit:contain;flex:none}
svg.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* header */
header.top{background:var(--hdr);color:#fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:30;border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hdr);z-index:31}
.top .wrap{display:flex;align-items:center;gap:14px;padding-block:12px}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto;min-width:0}
.mark{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#f3c04f,#c98a14);display:grid;place-items:center;color:#1a1204;flex:none}
.mark svg{width:36px;height:36px}
.brand-txt{min-width:0;line-height:1.1}
.brand-txt b{display:block;font:700 18px/1.1 var(--display);letter-spacing:.01em;white-space:nowrap}
.brand-txt span{display:block;font-size:12px;color:#a9b8cc;letter-spacing:.06em;text-transform:uppercase;font-weight:600;white-space:nowrap}
.hdr-actions{display:flex;align-items:center;gap:8px}
.hdr-actions select{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);color:#fff;border-radius:10px;padding:7px 10px;font-weight:600;font-size:14px}
.hdr-actions select option{color:#0d1b2a}
.iconbtn{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:10px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.08);color:#fff}
nav.tabs{display:flex;gap:4px;background:rgba(255,255,255,.06);padding:4px;border-radius:12px}
nav.tabs button{display:flex;align-items:center;gap:7px;border:0;background:none;color:#b9c6d8;padding:8px 14px;border-radius:9px;font-weight:700;font-size:14px;position:relative}
nav.tabs button[aria-selected=true]{background:#fff;color:#0d1b2a}
nav.tabs .dot{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--live);box-shadow:0 0 0 2px var(--hdr);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

main{padding-block:24px 64px;min-height:60vh}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:0 0 14px}
.sec-h h2{font:700 20px/1.2 var(--display);margin:0;letter-spacing:.01em}
.sub{color:var(--muted);font-size:13px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;box-shadow:var(--shadow)}
.seg button{border:0;background:none;padding:6px 14px;border-radius:9px;font-size:13px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line-2);border-radius:10px;padding:8px 14px;font-weight:700;font-size:14px}
.btn:hover{border-color:var(--muted)}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--sea);border-color:var(--sea);color:var(--on-sea)}
.btn.gold{background:var(--gold-soft);border-color:transparent;color:var(--gold)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
select.input,input.input{background:var(--surface);border:1px solid var(--line-2);border-radius:10px;padding:8px 12px;font-weight:600;font-size:14px;min-width:0}

/* chips & pills */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:4px 9px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.live{background:var(--live);color:#fff}
.pill.live::before{content:"";width:6px;height:6px;border-radius:50%;background:#fff;animation:pulse 1.2s infinite}
.pill.final{background:var(--ink);color:var(--bg)}
.fp{display:inline-flex;align-items:center;justify-content:center;min-width:46px;padding:3px 8px;border-radius:8px;background:var(--gold-soft);color:var(--gold);font-weight:800}
.fp.big{font-size:16px;padding:5px 10px}
.fp.neg{background:var(--surface-2);color:var(--loss)}

/* progress */
.prog{display:flex;align-items:center;gap:12px;padding:12px 14px;margin-bottom:14px;font-size:13px;color:var(--muted)}
.prog .bar{flex:1;height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.prog .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold-bright),var(--gold));border-radius:inherit;transition:width .3s}

/* games */
.roundnav{display:flex;align-items:center;gap:8px}
.roundnav strong{font:700 17px var(--display);min-width:120px;text-align:center}
.roundnav .btn{padding:8px 11px}
.day{margin-bottom:24px}
.day h3{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(310px,100%),1fr));gap:12px}
.game{display:flex;flex-direction:column;gap:10px;text-align:left;width:100%;min-width:0;max-width:100%;overflow:hidden;padding:14px 16px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
.game:hover{transform:translateY(-2px);border-color:var(--line-2)}
.game.is-live{border-color:var(--live);box-shadow:0 0 0 1px var(--live),var(--shadow)}
.g-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.g-top .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1;text-align:right}
.g-top .pill{flex:none}
.g-row{display:flex;align-items:center;gap:10px;min-width:0}
.g-row img{width:30px;height:30px}
.g-name{flex:1;min-width:0;font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-score{font-weight:800;font-size:22px;letter-spacing:-.01em}
.g-row.lost .g-name,.g-row.lost .g-score{color:var(--muted);font-weight:600}
.g-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:1px solid var(--line);padding-top:10px;font-size:13px;color:var(--muted)}
.g-foot b{color:var(--ink);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.livestrip{margin-bottom:28px}
.part-h{font:700 16px var(--display);margin:6px 0 12px;padding-top:6px}
.part-h + .day{margin-top:0}
.day + .part-h{border-top:1px solid var(--line);padding-top:20px;margin-top:4px}
.livestrip h2{color:var(--live)}

/* leaders */
.leaders{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.lcard{padding:16px}
.lcard.hero{grid-column:span 2;background:linear-gradient(160deg,var(--gold-soft),var(--surface) 55%)}
@media (max-width:640px){.lcard.hero{grid-column:auto}}
.lcard h3{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 0 10px;font-size:15px;font-weight:800}
.lcard h3 small{font-weight:600;color:var(--muted);font-size:12px}
.lcard h3 button{background:none;border:0;color:var(--sea);font-weight:700;font-size:12px;padding:0;white-space:nowrap}
.lcard ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.li{display:grid;grid-template-columns:24px 26px 1fr auto;gap:10px;align-items:center;padding:7px 8px;border-radius:10px;cursor:pointer;position:relative}
.li:hover{background:var(--surface-2)}
.li .rk{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;background:var(--surface-2);color:var(--muted)}
.li:first-child .rk{background:var(--gold-bright);color:#1a1204}
.li img{width:24px;height:24px}
.who{min-width:0;line-height:1.25}
.who b{display:block;font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small{color:var(--muted);font-size:12px}
.li .v{font-weight:800;font-size:15px}
.li .meter{grid-column:3/5;height:4px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:-2px}
.li .meter i{display:block;height:100%;background:var(--sea);border-radius:inherit;opacity:.7}
.hero .li .meter i{background:var(--gold-bright);opacity:1}
.hero ol{display:grid;grid-template-columns:repeat(2,1fr);gap:2px 16px}
@media (max-width:640px){.hero ol{grid-template-columns:1fr}}

/* tables */
.tframe{overflow:auto;border-radius:var(--radius);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:14px}
th,td{padding:10px 10px;text-align:right;white-space:nowrap}
thead th{position:sticky;top:0;z-index:2;background:var(--surface-2);font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line)}
th.sortable{cursor:pointer;user-select:none}
th.sorted{color:var(--ink)}
th.sorted::after{content:" ↓"}
th.sorted.asc::after{content:" ↑"}
tbody td{border-bottom:1px solid var(--line);font-weight:500}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--surface-2)}
tr.click{cursor:pointer}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;z-index:1;background:var(--surface)}
thead th:first-child{z-index:3;background:var(--surface-2)}
.l{text-align:left}
td.key{font-weight:800;color:var(--ink)}
td.fpc,th.fpc{background:var(--gold-soft)}
thead th.fpc{color:var(--gold)}
td.fpc{color:var(--gold);font-weight:800}
tbody tr:hover td.fpc{background:var(--gold-soft)}
.pn{display:flex;align-items:center;gap:10px}
.pn img{width:22px;height:22px}
.pn b{font-weight:700}
.pn .jn{display:inline-grid;place-items:center;min-width:24px;height:24px;border-radius:7px;background:var(--surface-2);font-size:12px;font-weight:800;color:var(--muted)}
.pn .st{font-size:10px;font-weight:800;color:var(--sea);background:var(--sea-soft);padding:1px 5px;border-radius:5px}
tr.grp td{background:var(--surface-2)!important;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:6px 10px}
tr.tot td{font-weight:800;background:var(--surface-2)}
tr.oncourt td:first-child{box-shadow:inset 3px 0 0 var(--live)}
.pos{color:var(--win)}.negv{color:var(--loss)}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.filters .input{flex:1 1 180px}
.form{display:inline-flex;gap:3px}
.form i{font-style:normal;font-size:10px;font-weight:800;width:18px;height:18px;display:inline-grid;place-items:center;border-radius:5px;color:#fff}
.form i.W{background:var(--win)}.form i.L{background:var(--loss)}
.zone{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:8px;font-weight:800;font-size:12px;background:var(--surface-2)}
.zone.po{background:var(--sea);color:#fff}
.zone.pi{background:var(--gold-soft);color:var(--gold)}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* sheet */
.overlay{position:fixed;inset:0;background:rgba(5,10,20,.5);backdrop-filter:blur(2px);z-index:50;display:flex;justify-content:flex-end}
.sheet{background:var(--bg);width:min(1000px,100%);height:100%;overflow-y:auto;display:flex;flex-direction:column;box-shadow:-20px 0 60px rgba(0,0,0,.25);animation:slide .22s ease-out}
@keyframes slide{from{transform:translateX(40px)}}
.sheet-bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));padding-top:max(12px,env(safe-area-inset-top,0px));background:var(--bg);border-bottom:1px solid var(--line)}
.sheet-bar .t{flex:1;font-weight:700;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-body{padding:18px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px}
.sheet-body h3{font:700 16px var(--display);margin:0 0 10px}
.match{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:20px 16px;text-align:center}
.match img{width:56px;height:56px}
.match .nm{font-weight:800;font-size:16px;margin-top:6px}
.match .sc{font-weight:800;font-size:44px;letter-spacing:-.02em;line-height:1}
.match .sc span{color:var(--muted);font-weight:500;margin:0 6px}
.match .mid{display:flex;flex-direction:column;align-items:center;gap:8px}
.qt{font-size:13px}
.qt td,.qt th{text-align:center;padding:6px 10px}
.mvp{display:flex;align-items:center;gap:14px;padding:14px 16px;background:linear-gradient(120deg,var(--gold-soft),var(--surface) 70%)}
.mvp .lab{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.mvp b{font-size:17px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.tile{padding:12px 14px}
.tile small{display:block;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tile b{font-size:22px;font-weight:800;letter-spacing:-.01em}
.tile.g{background:var(--gold-soft);border-color:transparent}
.tile.g small,.tile.g b{color:var(--gold)}
.phead{display:flex;align-items:center;gap:14px;padding:16px}
.phead img{width:52px;height:52px}
.phead h2{font:700 22px/1.15 var(--display);margin:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.box{padding:16px}
.note{color:var(--muted);font-size:13px;margin:8px 0 0}
.empty,.err{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line-2);border-radius:var(--radius);background:var(--surface)}
.err{text-align:left;color:var(--ink);border-color:var(--loss)}
.err code{background:var(--surface-2);padding:2px 6px;border-radius:5px}
.loading{color:var(--muted);padding:24px 0;font-weight:600}
.rules{table-layout:fixed}
.rules td{padding:10px 12px;white-space:normal;line-height:1.35}
.rules td:first-child{position:static;width:auto}
.rules td:last-child{width:72px;text-align:right;font-weight:800;font-size:15px;white-space:nowrap}
#stale{padding-top:16px}
#stale .prog{margin:0;color:var(--ink);border-color:var(--gold-bright);background:var(--gold-soft)}
#stale .prog span{flex:1}
.livebar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px 10px 16px;font-size:13px;color:var(--muted)}
.livebar b{color:var(--ink);font-weight:700}
.livebar .btn{padding:7px 14px;font-size:13px;flex:none}
.teamh{display:flex;align-items:center;gap:12px;margin:4px 0 10px}
.teamh h3{margin:0;line-height:1.2}
.teamh .sub{font-size:12px}
.mvp-n{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mvp .sub{font-size:13px}
.mt-title{font:700 20px/1.2 var(--display);margin:0 0 10px}
.mt-total{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:16px 18px;margin-bottom:14px;background:linear-gradient(120deg,var(--gold-soft),var(--surface) 70%)}
.mt-total .lab{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.mt-total .big{font-weight:800;font-size:40px;letter-spacing:-.02em;line-height:1.1;color:var(--gold)}
.mt-tbtns{display:flex;gap:8px;flex-wrap:wrap}
.mt-wcs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mt-wcbar{margin-bottom:12px}
.mt-wc{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:10px 12px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);min-width:0}
.mt-wc b{font-size:14px}
.mt-wc span{font-size:12px;color:var(--muted)}
.mt-wc i{font-style:normal;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--sea);margin-top:4px}
.mt-wc.on{background:var(--gold-soft);border-color:var(--gold-bright)}
.mt-wc.on i{color:var(--gold)}
.mt-ask{margin-bottom:12px;border-color:var(--gold-bright)}
.mt-hint{font-size:13px;color:var(--muted);margin:0 0 12px;padding:8px 12px;border-radius:10px;background:var(--surface-2)}
.mt-sec{margin-bottom:14px}
.mt-sech{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 0 8px}
.mt-sech h3{margin:0;font-size:15px;font-weight:800}
.mt-list{overflow:hidden}
.mt-box-c{border-color:var(--gold-bright);background:linear-gradient(120deg,var(--gold-soft),var(--surface) 60%)}
.mt-row{display:grid;grid-template-columns:22px minmax(0,1fr) auto;align-items:center;gap:10px;padding:10px 14px 10px 8px;border-bottom:1px solid var(--line);cursor:grab;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;transition:background .12s,box-shadow .12s}
.mt-row:last-child{border-bottom:0}
.mt-row:hover{background:var(--surface-2)}
.mt-row.is-live{box-shadow:inset 3px 0 0 var(--live)}
.mt-row.empty-slot{cursor:pointer;min-height:52px}
.mt-row.empty-slot .sub{font-style:italic}

<div class="wrap" id="stale" hidden></div>

<script>
"use strict";
/* ================= config ================= */
const COMP = "E";
const HOSTS = { api: "https://api-live.euroleague.net", live: "https://live.euroleague.net" };
const LIVE_REFRESH_MS = 20000;              // live games only: tiny score feed, plus the box score you have open
const SCHEDULE_MAX_AGE = 3 * 3600e3;        // full season schedule: re-download at most every 3 hours
const DATA_MAX_AGE = 3 * 3600e3;            // season player stats: same, or sooner once a game finishes
const HISTORY_SEASONS = 5;
const NOW_SEASON = (() => { const d = new Date(); return d.getMonth() >= 6 ? d.getFullYear() : d.getFullYear() - 1; })();
const SEASONS = [0, 1, 2, 3, 4].map(i => NOW_SEASON - i);
const seasonLabel = (y) => `${y}-${String(y + 1).slice(2)}`;

/* ================= state ================= */
const S = {
  season: NOW_SEASON, tab: "games", games: [], round: null,
  players: { Accumulated: null, PerGame: null }, mode: "PerGame",
  sort: { key: "fp", asc: false }, search: "", team: "",
  live: new Map(), standings: null, timer: null, viaProxy: false,
  agg: null, tops: [], gameTop: new Map(), fpPromise: null, fpProg: null, token: 0, staleKeys: new Map(),
};
try { const t = localStorage.getItem("sm-tab"); if (t) S.tab = t; } catch (e) {}

/* ================= storage (finished games never change) ================= */
const store = {
  get(k) { try { const v = localStorage.getItem("sm1:" + k); return v ? JSON.parse(v) : null; } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem("sm1:" + k, JSON.stringify(v)); } catch (e) {} },
};

/* ================= network ================= */
// At most 3 requests in flight at once, and up to 4 attempts per request with growing pauses,
// so bursts (e.g. reading every box score) don't trip the API's rate limits.
const MAX_INFLIGHT = 3, RETRY_DELAYS = [700, 1800, 4000];
let inflight = 0; const waiters = [];
const sleep = (ms) => new Promise(r => setTimeout(r, ms));
async function slot() { if (inflight < MAX_INFLIGHT) { inflight++; return; } await new Promise(r => waiters.push(r)); inflight++; }
function release() { inflight--; const w = waiters.shift(); if (w) w(); }
async function fetchJSON(u) {
  await slot();
  try { const r = await fetch(u, { cache: "no-store" }); if (!r.ok) { const e = new Error("HTTP " + r.status); e.status = r.status; throw e; } return await r.json(); }
  finally { release(); }
}
async function withRetry(u) {
  let last;
  for (let i = 0; i <= RETRY_DELAYS.length; i++) {
    try { return await fetchJSON(u); }
    catch (e) { last = e; if (e.status === 404 || i === RETRY_DELAYS.length) break; await sleep(RETRY_DELAYS[i] + Math.random() * 400); }
  }
  throw last;
}
async function getJSON(host, path) {
  if (!S.viaProxy) {
    try { return await withRetry(HOSTS[host] + path); }
    catch (e) { if (location.protocol === "file:" || /github\.io$/.test(location.hostname) || location.protocol === "https:") throw e; S.viaProxy = true; }
  }
  return withRetry("/proxy/" + host + path);
}
async function pool(items, size, fn) {
  let i = 0;
  const run = async () => { while (i < items.length) { const it = items[i++]; await fn(it); } };
  await Promise.all(Array.from({ length: Math.min(size, items.length) }, run));
}

/* ================= helpers ================= */
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const n = (v) => { const x = parseFloat(v); return isFinite(x) ? x : 0; };
const f1 = (x) => (Math.round(x * 10) / 10).toFixed(1);
const nice = (name) => {
  const [last, first] = String(name || "").split(",").map(s => s.trim());
  const cap = s => (s || "").toLowerCase().replace(/(^|[\s'.-])\p{L}/gu, m => m.toUpperCase());
  return first ? cap(first) + " " + cap(last) : cap(last);
};
const dtf = new Intl.DateTimeFormat(undefined, { weekday: "short", day: "numeric", month: "short" });
const ydf = new Intl.DateTimeFormat(undefined, { day: "numeric", month: "short", year: "numeric" });
const tf = new Intl.DateTimeFormat(undefined, { hour: "2-digit", minute: "2-digit" });
const tfs = new Intl.DateTimeFormat(undefined, { hour: "2-digit", minute: "2-digit", second: "2-digit" });
const clubOf = (code) => { for (const g of S.games) { if (g.home.code === code) return g.home; if (g.away.code === code) return g.away; } return null; };
const crestOf = (code) => clubOf(code)?.crest || "";
const fpChip = (v, big) => `<span class="fp ${big ? "big" : ""} ${v < 0 ? "neg" : ""}">${f1(v)}</span>`;

/* ================= data normalisation ================= */
const normClub = (s) => ({ code: s.club.code, name: s.club.name, abbr: s.club.abbreviatedName || s.club.name, crest: s.club.images?.crest || "", score: n(s.score) });
const normGame = (g) => ({ code: g.gameCode, date: g.utcDate, round: g.round, phase: g.phaseType?.code || "", phaseName: g.phaseType?.name || "", roundName: g.roundName || "", played: !!g.played, home: normClub(g.local), away: normClub(g.road), venue: g.venue?.name || "" });
const packG = (g) => [g.code, g.date, g.round, g.phase, g.home.code, g.home.name, g.home.score, g.away.code, g.away.name, g.away.score];
const unpackG = (a) => ({ code: a[0], date: a[1], round: a[2], phase: a[3], phaseName: "", roundName: "", played: true, venue: "",
  home: { code: a[4], name: a[5], abbr: a[5], crest: "", score: a[6] }, away: { code: a[7], name: a[8], abbr: a[8], crest: "", score: a[9] } });

const F = ["code","name","team","dorsal","st","on","sec","pts","m2","a2","m3","a3","ftm","fta","or","dr","tr","ast","stl","tov","blk","ba","pf","fd","pir","pm"];
const secs = (m) => { if (!m || !/\d/.test(m)) return 0; const [a, b] = String(m).split(":"); return (+a || 0) * 60 + (+b || 0); };
const mmss = (s) => s ? `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}` : "DNP";
const normLine = (r) => ({
  code: String(r.Player_ID || "").trim().replace(/^P/, ""), name: r.Player || "", team: String(r.Team || "").trim(), dorsal: r.Dorsal ?? "",
  st: r.IsStarter ? 1 : 0, on: r.IsPlaying ? 1 : 0, sec: secs(r.Minutes), pts: n(r.Points),
  m2: n(r.FieldGoalsMade2), a2: n(r.FieldGoalsAttempted2), m3: n(r.FieldGoalsMade3), a3: n(r.FieldGoalsAttempted3),
  ftm: n(r.FreeThrowsMade), fta: n(r.FreeThrowsAttempted), or: n(r.OffensiveRebounds), dr: n(r.DefensiveRebounds), tr: n(r.TotalRebounds),
  ast: n(r.Assistances), stl: n(r.Steals), tov: n(r.Turnovers), blk: n(r.BlocksFavour), ba: n(r.BlocksAgainst),
  pf: n(r.FoulsCommited), fd: n(r.FoulsReceived), pir: n(r.Valuation), pm: r.Plusminus == null ? null : n(r.Plusminus),
});
function normBox(b) {
  const teams = (b.Stats || []).map(T => {
    const players = (T.PlayersStats || []).map(normLine);
    const code = String(T.tmr?.Team || T.totr?.Team || players[0]?.team || "").trim();
    return { code, name: T.Team || code, coach: T.Coach || "", players, tot: T.totr ? normLine(T.totr) : null };
  });
  const quarters = (b.ByQuarter || []).map(q => ({ team: q.Team, q: Object.keys(q).filter(k => k !== "Team" && q[k] != null).map(k => [k, q[k]]) }));
  return { live: !!b.Live, teams, quarters };
}
const packBox = (b) => ({ live: b.live, quarters: b.quarters, teams: b.teams.map(t => ({ code: t.code, name: t.name, coach: t.coach, players: t.players.map(l => F.map(k => l[k])), tot: t.tot && F.map(k => t.tot[k]) })) });
const unpackLine = (a) => Object.fromEntries(F.map((k, i) => [k, a[i]]));
const unpackBox = (b) => ({ live: b.live, quarters: b.quarters, teams: b.teams.map(t => ({ ...t, players: t.players.map(unpackLine), tot: t.tot && unpackLine(t.tot) })) });

/* ================= Fantasy Points ================= */
const FP_RULES = [
  ["Point scored", "+1"], ["Defensive rebound", "+1"], ["Offensive rebound", "+1.5"], ["Assist", "+1.5"], ["Steal", "+1.5"],
  ["Blocked shot", "+1"], ["Foul drawn", "+1"], ["Double-double (two of points, rebounds, assists, steals, blocks at 10+)", "+10"],
  ["Triple-double", "+30"], ["Quadruple-double", "+100"], ["Player's team wins", "+1.5"], ["Player's team loses", "−1.5"],
  ["Missed shot (2 or 3)", "−1"], ["Turnover", "−1.5"], ["Missed free throw", "−1"], ["Shot blocked by opponent", "−0.5"], ["Five personal fouls", "−5"],
];
const ddCount = (l) => [l.pts, l.tr, l.ast, l.stl, l.blk].filter(v => v >= 10).length;
function fpParts(l, res) {
  if (!l || !l.sec) return [];
  const missed = (l.a2 - l.m2) + (l.a3 - l.m3), missedFt = l.fta - l.ftm, dd = ddCount(l);
  const p = [["Points", l.pts], ["Defensive rebounds", l.dr], ["Offensive rebounds", 1.5 * l.or], ["Assists", 1.5 * l.ast], ["Steals", 1.5 * l.stl],
    ["Blocks", l.blk], ["Fouls drawn", l.fd], ["Missed shots", -missed], ["Turnovers", -1.5 * l.tov], ["Missed free throws", -missedFt], ["Shots blocked", -0.5 * l.ba]];
  if (dd >= 4) p.push(["Quadruple-double", 100]); else if (dd === 3) p.push(["Triple-double", 30]); else if (dd === 2) p.push(["Double-double", 10]);
  if (res === "W") p.push(["Team win", 1.5]); else if (res === "L") p.push(["Team loss", -1.5]);
  if (l.pf >= 5) p.push(["Five fouls", -5]);
  return p.filter(x => x[1] !== 0);
}
const fp = (l, res) => fpParts(l, res).reduce((a, x) => a + x[1], 0);
function resultFor(g, team) {
  if (!g.played) return null;
  if (team === g.home.code) return g.home.score > g.away.score ? "W" : "L";
  if (team === g.away.code) return g.away.score > g.home.score ? "W" : "L";
  return null;
}
const teamOf = (g, b, ti) => { const c = b.teams[ti]?.code; return (c === g.home.code || c === g.away.code) ? c : (ti === 0 ? g.home.code : g.away.code); };

/* ================= loaders ================= */
const boxMem = new Map(), schedMem = new Map(), teamMem = new Map();
async function loadBox(season, code, final) {
  const key = `${COMP}${season}:${code}`;
  if (final) {
    const m = boxMem.get(key); if (m && m.fin) return m;
    const c = store.get("b:" + key);
    if (c) { const b = unpackBox(c); b.fin = true; boxMem.set(key, b); return b; }
  }
  const b = normBox(await getJSON("live", `/api/Boxscore?gamecode=${code}&seasoncode=${COMP}${season}`));
  b.fin = !!final && !b.live;
  boxMem.set(key, b);
  if (final && !b.live && b.teams.length) store.set("b:" + key, packBox(b));
  return b;
}
async function loadSchedule(y) {
  if (y === S.season && S.games.length) return S.games;
  if (schedMem.has(y)) return schedMem.get(y);
  const done = y < NOW_SEASON;
  let list = done ? store.get("s:" + y) : null;
  if (list) list = list.map(unpackG);
  else {
    const d = await getJSON("api", `/v2/competitions/${COMP}/seasons/${COMP}${y}/games`);
    list = (d.data || []).map(normGame);
    if (done) store.set("s:" + y, list.filter(g => g.played).map(packG));
  }
  schedMem.set(y, list); return list;
}
async function loadTeamMap(y) {
  if (teamMem.has(y)) return teamMem.get(y);
  const done = y < NOW_SEASON;
  let m = done ? store.get("t:" + y) : null;
  if (!m) {
    const d = await getJSON("api", `/v3/competitions/${COMP}/statistics/players/traditional?seasonMode=Single&statisticMode=Accumulated&seasonCode=${COMP}${y}&limit=2000`);
    m = {}; for (const p of d.players || []) m[p.player.code] = p.player.team.code;
    if (done) store.set("t:" + y, m);
  }
  teamMem.set(y, m); return m;
}
/* Keep the last good copy; if EuroLeague can't be reached, fall back to it and show a banner. */
async function fresh(key, fetcher, maxAge = 0, afterFinals = false) {
  if (maxAge) {
    const c = store.get("last:" + key);
    if (c && Date.now() - c.t < maxAge && (!afterFinals || c.t > (S.finalsAt || 0))) return c.v;
  }
  try { const v = await fetcher(); store.set("last:" + key, { t: Date.now(), v }); markOnline(key); return v; }
  catch (e) { const c = store.get("last:" + key); if (!c) throw e; S.staleKeys.set(key, c.t); paintStale(); return c.v; }
}
function markOnline(key) { if (S.staleKeys.delete(key)) paintStale(); }
function paintStale() {
  // Saved data is shown silently when loading fails; background retries continue via tick().
  const el = $("#stale"); if (el) { el.hidden = true; el.innerHTML = ""; }
}
// EuroLeague's per-game list leaves out players with only a few games, so the per-game view is
// worked out here from the complete season-totals list: every player who has appeared is included.
const PER_GAME_KEYS = ["min", "pts", "reb", "oreb", "dreb", "ast", "stl", "blk", "tov", "pf", "fd", "fgm", "fga", "tpm", "tpa", "ftm", "fta", "pir"];
function perGame(p) { const o = { ...p }, g = p.gp || 1; for (const k of PER_GAME_KEYS) o[k] = p[k] / g; return o; }
async function loadPlayers(mode) {

  const d = await fresh(`p:${S.season}:${mode}`, () => getJSON("api", `/v3/competitions/${COMP}/statistics/players/traditional?seasonMode=Single&statisticMode=${mode}&seasonCode=${COMP}${S.season}&limit=2000`),
    S.season < NOW_SEASON ? Infinity : DATA_MAX_AGE, true);

}

    gp: n(p.gamesPlayed), gs: n(p.gamesStarted), min: n(p.minutesPlayed), pts: n(p.pointsScored),
    reb: n(p.totalRebounds), oreb: n(p.offensiveRebounds), dreb: n(p.defensiveRebounds), ast: n(p.assists),
    stl: n(p.steals), blk: n(p.blocks), tov: n(p.turnovers), pf: n(p.foulsCommited), fd: n(p.foulsDrawn),
    fgm, fga, fgp: fga ? 100 * fgm / fga : 0,
    tpm: n(p.threePointersMade), tpa: n(p.threePointersAttempted), tpp: n(p.threePointersAttempted) ? 100 * n(p.threePointersMade) / n(p.threePointersAttempted) : 0,
    ftm: n(p.freeThrowsMade), fta: n(p.freeThrowsAttempted), ftp: n(p.freeThrowsAttempted) ? 100 * n(p.freeThrowsMade) / n(p.freeThrowsAttempted) : 0,

async function loadStandings() {
  if (S.standings) return S.standings;
  const rs = S.games.filter(g => g.phase === "RS" && g.played).map(g => g.round);
  const r = rs.length ? Math.max(...rs) : 1;
  for (const rr of [r, r - 1]) {
    if (rr < 1) continue;
    try {
      const d = await getJSON("api", `/v3/competitions/${COMP}/seasons/${COMP}${S.season}/rounds/${rr}/basicstandings`);
      if (d.teams?.length) { S.standings = { round: rr, teams: d.teams }; return S.standings; }
    } catch (e) {}
  }

}
// Fallback: build the table from finished regular-season results (wins, then point difference).
function computeStandings() {
  const T = new Map();
  const get = (c) => { if (!T.has(c.code)) T.set(c.code, { club: { code: c.code, name: c.name, images: { crest: c.crest } }, w: 0, l: 0, pf: 0, pa: 0, hw: 0, hl: 0, aw: 0, al: 0, res: [] }); return T.get(c.code); };
  for (const g of S.games.filter(g => g.phase === "RS")) {
    const h = get(g.home), a = get(g.away);
    if (!g.played) continue;
    const hw = g.home.score > g.away.score;
    h.pf += g.home.score; h.pa += g.away.score; a.pf += g.away.score; a.pa += g.home.score;
    if (hw) { h.w++; h.hw++; a.l++; a.al++; } else { a.w++; a.aw++; h.l++; h.hl++; }
    h.res.push(hw ? "W" : "L"); a.res.push(hw ? "L" : "W");
  }
  return [...T.values()].sort((x, y) => y.w - x.w || (y.pf - y.pa) - (x.pf - x.pa)).map((t, i) => {
    const gp = t.w + t.l, d = t.pf - t.pa;
    return { position: i + 1, gamesPlayed: gp, gamesWon: t.w, gamesLost: t.l, club: t.club, winPercentage: gp ? Math.round(100 * t.w / gp) + "%" : "0%",
      pointsDifference: (d > 0 ? "+" : "") + d, pointsFor: t.pf, pointsAgainst: t.pa, homeRecord: `${t.hw}-${t.hl}`, awayRecord: `${t.aw}-${t.al}`, last5Form: t.res.slice(-5) };

}

/* ===== season Fantasy Points: built from every finished game's box score ===== */
function ensureFP() {
  if (S.fpPromise) return S.fpPromise;
  const tok = S.token, played = S.games.filter(g => g.played);
  S.fpProg = { done: 0, total: played.length };
  S.fpPromise = (async () => {
    await pool(played, 2, async g => {
      try { await loadBox(S.season, g.code, true); } catch (e) {}
      if (tok !== S.token) return;
      S.fpProg.done++; paintProgress();
    });
    if (tok !== S.token) return null;
    buildAgg(played);
    paintProgress();
    if (["leaders", "players", "games"].includes(S.tab)) render();
    return S.agg;
  })();
  return S.fpPromise;
}
function buildAgg(played) {
  const agg = new Map(), tops = [], gameTop = new Map();
  for (const g of played) {
    const b = boxMem.get(`${COMP}${S.season}:${g.code}`); if (!b) continue;
    let best = null;
    b.teams.forEach((T, ti) => {
      const tc = teamOf(g, b, ti), res = resultFor(g, tc);
      for (const l of T.players) {
        if (!l.sec) continue;
        const v = fp(l, res), dd = ddCount(l);
        const a = agg.get(l.code) || { code: l.code, name: nice(l.name), team: tc, gp: 0, fp: 0, dd: 0, td: 0, best: -Infinity };
        a.gp++; a.fp += v; a.team = tc;
        if (dd >= 2) a.dd++; if (dd >= 3) a.td++;
        if (v > a.best) a.best = v;
        agg.set(l.code, a);
        tops.push({ code: l.code, name: nice(l.name), team: tc, fp: v, game: g, line: l });
        if (!best || v > best.fp) best = { name: nice(l.name), fp: v, code: l.code };
      }
    });
    if (best) gameTop.set(g.code, best);
  }
  S.agg = agg; S.tops = tops.sort((a, b) => b.fp - a.fp).slice(0, 10); S.gameTop = gameTop;
}
function progressHtml() {
  const p = S.fpProg; if (!p || S.agg) return "";
  const pct = p.total ? Math.round(100 * p.done / p.total) : 0;
  return `<div class="prog card" data-fpprog><span>Calculating Fantasy Points from box scores · <b data-fpcount>${p.done}/${p.total}</b> games</span><span class="bar"><i style="width:${pct}%"></i></span></div>`;
}
function paintProgress() {
  document.querySelectorAll("[data-fpprog]").forEach(el => {
    if (S.agg) { el.remove(); return; }
    const p = S.fpProg; el.querySelector("[data-fpcount]").textContent = `${p.done}/${p.total}`;
    el.querySelector(".bar i").style.width = (p.total ? Math.round(100 * p.done / p.total) : 0) + "%";
  });
}

/* ================= season boot + live polling ================= */
async function loadSeason() {
  clearInterval(S.timer);
  S.token++; S.staleKeys = new Map(); paintStale();
  Object.assign(S, { games: [], round: null, players: { Accumulated: null, PerGame: null }, live: new Map(), standings: null, agg: null, tops: [], gameTop: new Map(), fpPromise: null, fpProg: null });
  $("#main").innerHTML = `<div class="loading">Loading the ${seasonLabel(S.season)} season…</div>`;
  S.finalsAt = store.get("finat:" + S.season) || 0; S.lastSchedTry = 0;
  try { await refreshSchedule(); } catch (e) { return showError(e); }
  S.round = defaultRound(); MT.round = null;
  await pollLive();
  render();
  ensureFP();
  S.timer = setInterval(tick, LIVE_REFRESH_MS);
}
async function refreshSchedule(force) {
  S.games = await fresh(`g:${S.season}`, async () => {
    const d = await getJSON("api", `/v2/competitions/${COMP}/seasons/${COMP}${S.season}/games`);
    return (d.data || []).map(normGame).sort((a, b) => new Date(a.date) - new Date(b.date));
  }, force ? 0 : (S.season < NOW_SEASON ? Infinity : SCHEDULE_MAX_AGE));

}
/* Final buzzer, detected from the live score feed (no full-schedule download needed). */
const headerFinal = (L) => !!L && !L.Live && n(L.ScoreA) + n(L.ScoreB) > 0 && n(L.ScoreA) !== n(L.ScoreB)
  && /^0?0:00$/.test(String(L.RemainingPartialTime || "").trim()) && (!String(L.Quarter || "").trim() || n(L.Quarter) >= 4);

  const fin = store.get("fin:" + S.season) || {};

}
function applyLiveFinals() {
  const fin = store.get("fin:" + S.season) || {}; let changed = 0;

    if (g.played) continue;
    const L = S.live.get(g.code); if (!headerFinal(L)) continue;
    let h = n(L.ScoreA), a = n(L.ScoreB);
    if (String(L.CodeTeamA || "").trim() === g.away.code) [h, a] = [a, h];
    setFinal(g, h, a); fin[g.code] = [h, a]; changed++;

async function tick() {

    S.fpPromise = null; S.agg = null; S.standings = null; S.players = { Accumulated: null, PerGame: null }; ensureFP();
  }
  if (S.tab === "games") renderGames();
  if (S.tab === "myteam" && !$(".sheet") && !MT.drag && !MT.sel) renderMyTeam();   // your players' live games only

const roundKey = (g) => g.phase + "|" + g.round;
const roundLabel = (k) => { const g = S.games.find(x => roundKey(x) === k); if (!g) return ""; return g.phase === "RS" ? "Round " + g.round : (g.phaseName + " · " + (g.roundName || g.round)); };
function defaultRound() {

  if (!firstOpen) return rounds[rounds.length - 1];
  const k = roundKey(firstOpen);
  const started = S.games.some(g => roundKey(g) === k && g.played);
  if (!started && new Date(firstOpen.date) - Date.now() > 2 * 864e5) { const prev = rounds[rounds.indexOf(k) - 1]; if (prev) return prev; }

const liveLabel = (L) => {

};
const liveCandidates = () => S.games.filter(g => !g.played && Date.now() >= new Date(g.date).getTime() - 10 * 60e3 && Date.now() - new Date(g.date).getTime() < 6 * 3600e3);

  await Promise.all(liveCandidates().map(async g => {

function gameState(g) {

  if (L && L.Live) return "live";
  if (L && n(L.ScoreA) + n(L.ScoreB) > 0) return headerFinal(L) ? "ended" : "live";
  const start = new Date(g.date).getTime(), now = Date.now();
  if (now >= start && now - start < 4 * 3600e3) return "starting";

/* ================= render shell ================= */
function render() {
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === S.tab)));
  ({ games: renderGames, leaders: renderLeaders, players: renderPlayers, myteam: () => renderMyTeam({ fresh: true }), standings: renderStandings })[S.tab]();
}
function showError(e) {

  $("#main").innerHTML = `<div class="err"><b>Couldn't reach the EuroLeague API.</b><p>${esc(e.message || e)}</p>` +
    (fileMode ? `<p>Your browser blocked a direct call from a local file. In this folder run <code>node server.js</code>, then open <code>http://localhost:8787</code>.</p>`
              : `<p>The EuroLeague server didn't answer, even after several tries. This is usually brief.</p>`) +

const modeSeg = () => `<div class="seg" role="group" aria-label="Stat mode"><button data-mode="PerGame" aria-pressed="${S.mode === "PerGame"}">Per game</button><button data-mode="Accumulated" aria-pressed="${S.mode === "Accumulated"}">Season totals</button></div>`;

/* ================= games ================= */
function gameCard(g) {
  const st = gameState(g), L = S.live.get(g.code);
  const liveish = st === "live" || st === "ended";
  const hs = liveish ? n(L.ScoreA) : g.home.score, as = liveish ? n(L.ScoreB) : g.away.score;
  const showScore = st === "final" || liveish;
  const hl = showScore && hs < as, al = showScore && as < hs;
  const time = new Date(g.date);
  let pill = `<span class="pill">${tf.format(time)}</span>`;
  if (st === "final") pill = `<span class="pill final">Final</span>`;
  if (st === "live") pill = `<span class="pill live">${liveLabel(L)}</span>`;
  if (st === "starting") pill = `<span class="pill">Tip-off ${tf.format(time)}</span>`;
  if (st === "ended") pill = `<span class="pill final">Ended · confirming</span>`;
  const row = (c, s, lost) => `<div class="g-row ${lost ? "lost" : ""}"><img class="crest" src="${esc(c.crest)}" alt="" loading="lazy"><span class="g-name">${esc(c.name)}</span><span class="g-score">${showScore ? s : ""}</span></div>`;
  const top = st === "final" ? S.gameTop.get(g.code) : null;
  const foot = top ? `<div class="g-foot"><span>Top FP · <b>${esc(top.name)}</b></span>${fpChip(top.fp)}</div>`
    : st === "upcoming" ? `<div class="g-foot"><span>Tap for preview &amp; player history</span></div>` : "";
  return `<button class="game ${st === "live" ? "is-live" : ""}" data-game="${g.code}">
    <div class="g-top">${pill}<span class="sub">${esc(g.venue)}</span></div>
    ${row(g.home, hs, hl)}${row(g.away, as, al)}${foot}</button>`;
}
function renderGames() {
  if (S.tab !== "games") return;
  const rounds = [...new Set(S.games.map(roundKey))], i = rounds.indexOf(S.round);
  const live = S.games.filter(g => ["live", "ended"].includes(gameState(g)));
  const liveCodes = new Set(live.map(g => g.code));
  const inRoundAll = S.games.filter(g => roundKey(g) === S.round), inRound = inRoundAll.filter(g => !liveCodes.has(g.code));
  // Upcoming games first (soonest at the top), finished games below (most recent first).
  const groupByDay = (list) => { const m = new Map(); for (const g of list) { const k = dtf.format(new Date(g.date)); if (!m.has(k)) m.set(k, []); m.get(k).push(g); } return [...m]; };
  const upcomingList = inRound.filter(g => !g.played).sort((a, b) => new Date(a.date) - new Date(b.date));
  const finishedList = inRound.filter(g => g.played).sort((a, b) => new Date(b.date) - new Date(a.date));
  const dayBlocks = (list) => groupByDay(list).map(([d, gs]) => `<div class="day"><h3>${esc(d)}</h3><div class="grid">${gs.map(gameCard).join("")}</div></div>`).join("");
  const showHeads = upcomingList.length && finishedList.length;
  const nextUp = S.games.find(g => gameState(g) === "upcoming");
  $("#main").innerHTML =
    (live.length ? `<section class="livestrip"><div class="sec-h"><h2>Live now</h2><span class="sub">Updates every ${LIVE_REFRESH_MS / 1000} seconds</span></div><div class="grid">${live.map(gameCard).join("")}</div></section>` : "") +
    `<section><div class="sec-h"><div class="roundnav">
        <button class="btn" data-rnav="-1" ${i <= 0 ? "disabled" : ""} aria-label="Previous round">‹</button>
        <strong>${esc(roundLabel(S.round))}</strong>
        <button class="btn" data-rnav="1" ${i >= rounds.length - 1 ? "disabled" : ""} aria-label="Next round">›</button></div>
      <span class="sub">${inRoundAll.filter(g => g.played).length} of ${inRoundAll.length} played${liveCodes.size && inRoundAll.some(g => liveCodes.has(g.code)) ? ` · ${inRoundAll.filter(g => liveCodes.has(g.code)).length} live above` : ""}${nextUp ? " · next tip-off " + dtf.format(new Date(nextUp.date)) + ", " + tf.format(new Date(nextUp.date)) : ""}</span></div>
      ${(upcomingList.length ? (showHeads ? '<h3 class="part-h">Upcoming</h3>' : "") + dayBlocks(upcomingList) : "") +
        (finishedList.length ? (showHeads ? '<h3 class="part-h">Results</h3>' : "") + dayBlocks(finishedList) : "") || `<div class="empty">${inRoundAll.length ? "This round's games are live above." : "No games in this round."}</div>`}
    </section>`;
}

/* ================= sheet (detail panel) ================= */
let current = null, stack = [], goingBack = false, openGameCode = null;

  goingBack = false; current = reopen;
  $("#sheet-root").innerHTML = `<div class="overlay" data-close><aside class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="sheet-bar">${stack.length ? `<button class="btn" data-back>‹ Back</button>` : ""}<span class="t">${esc(title)}</span><button class="btn" data-close>Close</button></div>
    <div class="sheet-body">${body}</div></aside></div>`;
  document.body.style.overflow = "hidden";
}
function closeSheet() { $("#sheet-root").innerHTML = ""; current = null; stack = []; openGameCode = null; document.body.style.overflow = ""; }
function back() { const prev = stack.pop(); if (!prev) return closeSheet(); goingBack = true; prev(); }

/* ================= game sheet ================= */
async function openGame(code) {
  const g = S.games.find(x => x.code === code); if (!g) return;
  openGameCode = code;
  const st = gameState(g);
  sheet(`${roundLabel(roundKey(g))} · ${dtf.format(new Date(g.date))}, ${tf.format(new Date(g.date))} · ${g.venue}`, `<div id="gbody"><div class="loading">Loading…</div></div>`, () => openGame(code));
  if (st === "upcoming" || st === "starting" && !S.live.get(code)?.Live) return renderPreview(g);
  try { const b = await loadBox(S.season, code, st === "final"); if (openGameCode === code) renderBox(g, b); }
  catch (e) { $("#gbody").innerHTML = `<div class="err">The box score isn't available yet (${esc(e.message)}).</div>`; }
}
async function refreshGameNow(code, btn) {
  const g = S.games.find(x => x.code === code); if (!g) return;
  btn.disabled = true; btn.textContent = "Refreshing…";
  try { S.live.set(code, await getJSON("live", `/api/Header?gamecode=${code}&seasoncode=${COMP}${S.season}`)); } catch (e) {}
  if (applyLiveFinals()) { S.fpPromise = null; S.agg = null; S.standings = null; S.players = { Accumulated: null, PerGame: null }; ensureFP(); }
  try { const b = await loadBox(S.season, code, g.played); if (openGameCode === code && $("#gbody")) renderBox(g, b); }
  catch (e) { btn.disabled = false; btn.textContent = "↻ Refresh"; }

async function refreshOpenGame() {

  const g = S.games.find(x => x.code === openGameCode);
  if (!g || !["live", "ended"].includes(gameState(g))) return;

}
function matchHead(g, hs, as, mid) {
  const side = (c) => `<div><img class="crest" src="${esc(c.crest)}" alt=""><div class="nm">${esc(c.abbr)}</div></div>`;
  return `<div class="match card">${side(g.home)}<div class="mid"><div class="sc">${hs}<span>–</span>${as}</div>${mid}</div>${side(g.away)}</div>`;
}
function renderBox(g, b) {
  const L = S.live.get(g.code);
  if (!b.teams.length) { $("#gbody").innerHTML = '<div class="empty">No box score yet.</div>'; return; }
  const live = b.live || gameState(g) === "live";
  const ended = !live && !g.played;
  const mid = live ? `<span class="pill live">${liveLabel(L)}</span>`
    : `<span class="pill final">${ended ? "Ended · confirming" : "Final"}</span>`;
  const bar = live ? `<div class="livebar card"><span>Updated <b>${tfs.format(new Date())}</b><span class="wide-only"> · refreshes every ${LIVE_REFRESH_MS / 1000} s</span></span><button class="btn" data-refreshgame="${g.code}">↻ Refresh</button></div>` : "";
  let hs = b.teams[0]?.tot?.pts ?? g.home.score, as = b.teams[1]?.tot?.pts ?? g.away.score;
  if (live && L && n(L.ScoreA) + n(L.ScoreB) > 0) {   // the live feed is the most up-to-date score
    hs = n(L.ScoreA); as = n(L.ScoreB);
    if (String(L.CodeTeamA || "").trim() === g.away.code) [hs, as] = [as, hs];
  }
  // quarters
  const q = b.quarters, qk = q[0]?.q.map(x => x[0]) || [];
  const qt = q.length ? `<div class="tframe" style="align-self:center;max-width:100%"><table class="qt"><thead><tr><th></th>${qk.map(k => `<th>${esc(k.replace("Quarter", "Q").replace("ExtraTime", "OT"))}</th>`).join("")}</tr></thead><tbody>${q.map((r, i) => `<tr><td>${esc((i === 0 ? g.home : g.away).abbr)}</td>${r.q.map(x => `<td>${x[1]}</td>`).join("")}</tr>`).join("")}</tbody></table></div>` : "";
  // fantasy MVP
  let mvp = null;
  b.teams.forEach((T, ti) => { const res = live ? null : resultFor(g, teamOf(g, b, ti)); for (const l of T.players) { if (!l.sec) continue; const v = fp(l, res); if (!mvp || v > mvp.v) mvp = { l, v, ti }; } });
  const mvpHtml = mvp ? `<div class="mvp card"><img class="crest" src="${esc((mvp.ti === 0 ? g.home : g.away).crest)}" alt="" width="36" height="36"><div style="flex:1;min-width:0"><div class="lab">${live ? "Fantasy leader so far" : "Fantasy MVP"}</div><b class="mvp-n">${esc(nice(mvp.l.name))}</b><div class="sub">${mvp.l.pts} pts · ${mvp.l.tr} reb · ${mvp.l.ast} ast</div></div>${fpChip(mvp.v, true)}</div>` : "";
  $("#gbody").innerHTML = `<div style="display:flex;flex-direction:column;gap:16px">` + matchHead(g, hs, as, mid) + bar + qt + mvpHtml +

}
function teamBox(T, club, res) {
  const rows = T.players.map(l => ({ l, v: fp(l, res) }));
  const maxV = Math.max(...rows.filter(r => r.l.sec).map(r => r.v));
  const starters = rows.filter(r => r.l.st), bench = rows.filter(r => !r.l.st);
  const pm = (v) => v == null ? "" : `<span class="${v > 0 ? "pos" : v < 0 ? "negv" : ""}">${v > 0 ? "+" : ""}${v}</span>`;
  const line = ({ l, v }) => `<tr class="click ${l.on ? "oncourt" : ""}" data-player="${esc(l.code)}">
    <td><div class="pn"><span class="jn">${esc(l.dorsal)}</span><b>${esc(nice(l.name))}</b></div></td>
    <td class="fpc">${l.sec ? f1(v) + (v === maxV ? " ★" : "") : "–"}</td>
    <td class="key">${l.pts}</td><td>${l.tr}</td><td>${l.ast}</td><td>${l.stl}</td><td>${l.blk}</td><td>${l.tov}</td><td>${mmss(l.sec)}</td>
    <td>${l.m2}/${l.a2}</td><td>${l.m3}/${l.a3}</td><td>${l.ftm}/${l.fta}</td><td>${l.or}</td><td>${l.dr}</td><td>${l.ba}</td><td>${l.pf}</td><td>${l.fd}</td><td>${l.pir}</td><td>${pm(l.pm)}</td></tr>`;
  const t = T.tot;
  const tot = t ? `<tr class="tot"><td>Team totals</td><td class="fpc"></td><td>${t.pts}</td><td>${t.tr}</td><td>${t.ast}</td><td>${t.stl}</td><td>${t.blk}</td><td>${t.tov}</td><td></td><td>${t.m2}/${t.a2}</td><td>${t.m3}/${t.a3}</td><td>${t.ftm}/${t.fta}</td><td>${t.or}</td><td>${t.dr}</td><td>${t.ba}</td><td>${t.pf}</td><td>${t.fd}</td><td>${t.pir}</td><td></td></tr>` : "";
  const cols = 19;
  return `<section><div class="teamh"><img class="crest" src="${esc(club.crest)}" alt="" width="30" height="30"><div><h3>${esc(club.name)}</h3>${T.coach ? `<div class="sub">Coach ${esc(nice(T.coach))}</div>` : ""}</div></div>
    <div class="tframe"><table class="boxt"><thead><tr><th>Player</th><th class="fpc">FP</th><th>Pts</th><th>Reb</th><th>Ast</th><th>Stl</th><th>Blk</th><th>TO</th><th>Min</th><th>2P</th><th>3P</th><th>FT</th><th>OR</th><th>DR</th><th>BA</th><th>PF</th><th>FD</th><th>PIR</th><th>+/−</th></tr></thead>
    <tbody>${starters.length ? `<tr class="grp"><td colspan="${cols}">Starters</td></tr>` + starters.map(line).join("") : ""}${bench.length ? `<tr class="grp"><td colspan="${cols}">Bench</td></tr>` + bench.map(line).join("") : ""}${tot}</tbody></table></div></section>`;
}

const ordinal = (k) => k + (["th", "st", "nd", "rd"][(k % 100 - 20) % 10] || ["th", "st", "nd", "rd"][k % 100] || "th");

async function playerHistory(code, opp, back, onProg) {
  const years = []; for (let y = S.season; y >= Math.max(2007, S.season - back); y--) years.push(y);
  const targets = [];
  await Promise.all(years.map(async y => {
    try {
      let team;
      if (y === S.season) team = (await loadPlayers("Accumulated")).find(p => p.code === code)?.team || S.agg?.get(code)?.team;
      else team = (await loadTeamMap(y))[code];
      if (!team || team === opp) return;
      for (const g of await loadSchedule(y))
        if (g.played && ((g.home.code === team && g.away.code === opp) || (g.away.code === team && g.home.code === opp))) targets.push({ y, g, team });
    } catch (e) {}
  }));
  const out = []; let done = 0;
  await pool(targets, 6, async t => {
    try {
      const b = await loadBox(t.y, t.g.code, true);
      for (const T of b.teams) for (const l of T.players) if (l.code === code && l.sec) { const res = resultFor(t.g, t.team); out.push({ ...t, line: l, res, fp: fp(l, res) }); }
    } catch (e) {}
    onProg && onProg(++done, targets.length);
  });
  return out.sort((a, b) => new Date(b.g.date) - new Date(a.g.date));
}
const avg = (rows, f) => rows.length ? rows.reduce((s, r) => s + f(r), 0) / rows.length : 0;

async function renderH2H(code) {
  const g = S.games.find(x => x.code === code); if (!g) return;
  const el = $("#h2h"); el.innerHTML = `<div class="loading" id="h2hp">Looking through ${HISTORY_SEASONS + 1} seasons of box scores…</div>`;
  await ensureFP();
  const list = [...topByFP(g.home.code).map(a => ({ a, opp: g.away })), ...topByFP(g.away.code).map(a => ({ a, opp: g.home }))];
  if (!list.length) { el.innerHTML = '<p class="sub">No players to compare yet: no games have been played this season.</p>'; return; }
  const rows = []; let k = 0;
  for (const { a, opp } of list) {
    k++; const p = $("#h2hp"); if (p) p.textContent = `Checking ${a.name} vs ${opp.abbr} (${k} of ${list.length})…`;
    const h = await playerHistory(a.code, opp.code, HISTORY_SEASONS);
    rows.push({ a, opp, h });
  }
  if (!$("#h2h")) return;
  $("#h2h").innerHTML = `<div class="tframe"><table><thead><tr><th>Player</th><th class="l">Vs</th><th>Games</th><th>W–L</th><th class="fpc">FP / game</th><th>Pts</th><th>Reb</th><th>Ast</th><th>Best FP</th></tr></thead><tbody>${rows.map(({ a, opp, h }) => {
    const w = h.filter(r => r.res === "W").length;
    return `<tr class="click" data-player="${esc(a.code)}" data-opp="${esc(opp.code)}" data-auto="1"><td><b>${esc(a.name)}</b> <span class="sub">${esc(a.team)}</span></td><td class="l">${esc(opp.abbr)}</td><td>${h.length}</td><td>${h.length ? `${w}–${h.length - w}` : "–"}</td>
      <td class="fpc">${h.length ? f1(avg(h, r => r.fp)) : "–"}</td><td>${h.length ? f1(avg(h, r => r.line.pts)) : "–"}</td><td>${h.length ? f1(avg(h, r => r.line.tr)) : "–"}</td><td>${h.length ? f1(avg(h, r => r.line.ast)) : "–"}</td><td>${h.length ? f1(Math.max(...h.map(r => r.fp))) : "–"}</td></tr>`;
  }).join("")}</tbody></table></div><p class="note">Tap a player to see every game against that opponent.</p>`;
}

const CATS = [["pts", "Points"], ["reb", "Rebounds"], ["ast", "Assists"], ["pir", "PIR"], ["min", "Minutes"], ["gp", "Games played"],

function leaderList(items, valFn, fmtFn, hero) {
  const max = Math.max(...items.map(valFn), 0.0001);
  return `<ol>${items.map((p, i) => `<li class="li" data-player="${esc(p.code)}"><span class="rk">${i + 1}</span><img class="crest" src="${esc(p.crest || crestOf(p.team))}" alt="" loading="lazy"><span class="who"><b>${esc(p.name)}</b><small>${esc(p.team)}${p.sub ? " · " + esc(p.sub) : ""}</small></span><span class="v" ${hero ? 'style="color:var(--gold)"' : ""}>${fmtFn(valFn(p))}</span><span class="meter"><i style="width:${Math.max(4, 100 * valFn(p) / max)}%"></i></span></li>`).join("")}</ol>`;
}
async function renderLeaders() {

  if (S.agg) {

      <div class="lcard card"><h3><span>Best single games <small>FP</small></span></h3>${leaderList(singles, p => p.val, f1, true)}</div>
      <div class="lcard card"><h3><span>Double-doubles</span><button data-sortby="dd">Full list ›</button></h3>${dds.length ? leaderList(dds, p => p.val, v => String(v)) : '<p class="sub">None yet this season.</p>'}</div>`;

}

      <div id="fptiles">${fpTiles()}</div>

        <div class="row"><select class="input" id="hopp" aria-label="Opponent">${clubs.map(([c, cl]) => `<option value="${esc(c)}" ${c === opp ? "selected" : ""}>${esc(cl.name)}${nextOpp && c === nextOpp.code ? " (next opponent)" : ""}</option>`).join("")}</select>

function logTable(rows, showSeason) {

/* ================= My Team (saved on this phone/browser only) ================= */
// Step 1: pick up to 13 players (no positions). Step 2: drag them into boxes on the board.
// Captain 200% (300% Triple Captain) · Starters 100% · 6th man 100% · Bench 50% (100% Bench Boost) · Reserve 0%.
// DNP = 0. Multipliers apply to negative FP too. Every round has its own board; a new round starts from the previous one.
const POS = ["c0", "s0", "s1", "s2", "s3", "x0", "b0", "b1", "b2", "b3", "r0", "r1", "r2"];
const BOXES = [["c", "Captain", ["c0"]], ["s", "Starters", ["s0", "s1", "s2", "s3"]], ["x", "6th man", ["x0"]], ["b", "Bench", ["b0", "b1", "b2", "b3"]], ["r", "Reserve", ["r0", "r1", "r2"]]];
const SQUAD_MAX = 13;
const MT = { round: null, tok: 0, lines: {}, linesRound: null, sel: null, pd: null, drag: null, justDragged: false, draft: null, q: "", pl: null };
const mtKey = () => "myteam:" + S.season;
const clone = (o) => JSON.parse(JSON.stringify(o));
const mtSave = (d) => store.set(mtKey(), d);
const mtRounds = () => [...new Set(S.games.map(roundKey))];
function mtMigrate(e) {                       // earlier format {lu:{s[5],c,x,b[4],r[3]}} -> {squad, pos}
  if (!e || e.pos) return e;
  const lu = e.lu || {}, st = (lu.s || []).filter(Boolean), c = lu.c && st.includes(lu.c) ? lu.c : null, pos = {};
  if (c) pos.c0 = c;

  st.filter(x => x !== c).forEach((x, i) => i < 4 ? pos["s" + i] = x : rest.push(x));
  if (lu.x) pos.x0 = lu.x;
  (lu.b || []).forEach((x, i) => { if (x) pos["b" + i] = x; });
  (lu.r || []).forEach((x, i) => { if (x) pos["r" + i] = x; });
  for (const x of rest) { const free = POS.find(p => !pos[p] && p !== "c0"); if (free) pos[free] = x; }
  return { squad: Object.values(pos), pos, bb: !!e.bb, tc: !!e.tc, asked: !!e.asked };
}
function mtData() {
  const d = store.get(mtKey()) || {}; d.rounds = d.rounds || {}; d.meta = d.meta || {};
  for (const k in d.rounds) d.rounds[k] = mtMigrate(d.rounds[k]);
  return d;
}
function mtEntry(d, rk) {
  if (d.rounds[rk]) return { e: d.rounds[rk], from: null };
  const rs = mtRounds(), i = rs.indexOf(rk);
  for (let j = i - 1; j >= 0; j--) if (d.rounds[rs[j]]) { const p = d.rounds[rs[j]]; return { e: { squad: [...p.squad], pos: { ...p.pos }, bb: false, tc: false, asked: false }, from: rs[j] }; }

}
function mtMult(slot, e) { const k = slot[0]; return k === "c" ? (e.tc ? 3 : 2) : k === "s" || k === "x" ? 1 : k === "b" ? (e.bb ? 1 : 0.5) : 0; }

  const placed = new Set(Object.values(e.pos));
  for (const code of e.squad) if (!placed.has(code)) { const free = POS.find(p => !e.pos[p]); if (free) { e.pos[free] = code; placed.add(code); } }
}
function mtTeamOf(code, d) {
  const p = (S.players.PerGame || S.players.Accumulated)?.find(x => x.code === code);
  return p?.team || d.meta[code]?.t || S.agg?.get(code)?.team || "";
}
const mtName = (code, d) => d.meta[code]?.n || (S.players.PerGame || [])?.find(x => x.code === code)?.name || S.agg?.get(code)?.name || code;
function mtWithEntry(fn) {                    // edit this round's entry (saving an inherited one for this round)
  const d = mtData(), me = mtEntry(d, MT.round); if (!me) return;
  fn(me.e); d.rounds[MT.round] = me.e; mtSave(d);
}

// One player's line for a round: which game, its state, the box score line and his Fantasy Points.
async function mtLine(code, team, rk, boxFor) {
  const games = S.games.filter(g => roundKey(g) === rk);
  let g = games.find(x => x.home.code === team || x.away.code === team);
  const find = (b) => { for (let ti = 0; ti < b.teams.length; ti++) for (const l of b.teams[ti].players) if (l.code === code) return { l, ti }; return null; };
  if (!g) {   // traded player: look through this round's finished games
    for (const x of games.filter(x => x.played)) { try { if (find(await boxFor(x))) { g = x; break; } } catch (e) {} }
    if (!g) return { kind: "none" };
  }
  const st = gameState(g);
  if (st === "upcoming" || (st === "starting" && !S.live.get(g.code)?.Live)) return { kind: "pending", g, team };
  let b; try { b = await boxFor(g); } catch (e) { return { kind: "error", g, team }; }
  const f = find(b), tc = f ? teamOf(g, b, f.ti) : team;
  if (!f || !f.l.sec) return { kind: g.played ? "dnp" : "notyet", g, team: tc, fp: 0 };
  const res = g.played ? resultFor(g, tc) : null;
  return { kind: g.played ? "final" : "live", g, team: tc, l: f.l, fp: fp(f.l, res) };
}
function mtStatus(x) {

  if (x.kind === "pending") return `${vs} · ${dtf.format(new Date(g.date))}, ${tf.format(new Date(g.date))}`;
  if (x.kind === "error") return `${vs} · box score not available yet`;
  if (x.kind === "final" || x.kind === "dnp") {
    const my = home ? g.home.score : g.away.score, th = home ? g.away.score : g.home.score;
    return `<span class="${my > th ? "pos" : "negv"}" style="font-weight:800">${my > th ? "W" : "L"}</span> ${my}–${th} ${vs}${x.kind === "dnp" ? " · <b>DNP</b>" : ""}`;
  }
  const L = S.live.get(g.code); let a = n(L?.ScoreA), b = n(L?.ScoreB);
  if (String(L?.CodeTeamA || "").trim() === g.away.code) [a, b] = [b, a];
  const my = home ? a : b, th = home ? b : a, clock = L ? liveLabel(L).replace(/^Live( · )?/, "") : "";
  return `<span class="mt-live">● ${clock || "Live"}</span> ${my}–${th} ${vs}${x.kind === "notyet" ? " · not on court yet" : x.l?.on ? ' · <span class="mt-on">on court</span>' : ""}`;
}

/* ----- page ----- */

  if (S.tab !== "myteam" || MT.drag) return;

  if (!MT.round || !rs.includes(MT.round)) MT.round = defaultRound();
  const rk = MT.round, d = mtData(), me = mtEntry(d, rk);
  if (!me || !me.e.squad.length) { MT.sel = null; $("#main").innerHTML = mtHead(rk) + `<div class="empty"><p style="margin:0 0 14px"><b>No players yet.</b> Step 1: choose the players in your fantasy team. Step 2: drag them into Captain, Starters, 6th man, Bench and Reserve.</p><button class="btn primary" data-mt-edit>Choose players</button></div>${mtBackupLink()}`; return; }
  const roundGames = S.games.filter(g => roundKey(g) === rk);
  if (me.from && roundGames.some(g => g.played || ["live", "ended"].includes(gameState(g)))) { d.rounds[rk] = me.e; mtSave(d); }   // keep this round's board once it starts
  if (MT.linesRound !== rk || opts.fresh) { MT.lines = {}; MT.linesRound = rk; if (!$("#mt-board") || opts.fresh) paintBoard(true); }
  const boxes = new Map();
  const boxFor = (g) => { if (!boxes.has(g.code)) boxes.set(g.code, loadBox(S.season, g.code, g.played)); return boxes.get(g.code); };
  const codes = me.e.squad;
  if (codes.some(c => !mtTeamOf(c, d) || !d.meta[c])) {          // club unknown on this device (e.g. restored code): look it up
    try { const pl = await loadPlayers("PerGame"); for (const c of codes) { const p = pl.find(x => x.code === c); if (p) d.meta[c] = { n: p.name, t: p.team }; } mtSave(d); } catch (e) {}
  }
  const lines = await Promise.all(codes.map(c => mtLine(c, mtTeamOf(c, d), rk, boxFor).catch(() => ({ kind: "error" }))));
  if (tok !== MT.tok || S.tab !== "myteam" || MT.linesRound !== rk) return;
  MT.lines = Object.fromEntries(codes.map((c, k) => [c, lines[k]]));
  if (!MT.drag) paintBoard();
}
const mtHead = (rk) => { const rs = mtRounds(), i = rs.indexOf(rk);

    <button class="btn" data-mtrnav="-1" ${i <= 0 ? "disabled" : ""} aria-label="Previous round">‹</button>
    <strong>${esc(roundLabel(rk))}</strong>
    <button class="btn" data-mtrnav="1" ${i >= rs.length - 1 ? "disabled" : ""} aria-label="Next round">›</button></div>
    <span class="sub">Saved on this device only</span></div>`; };
function paintBoard(loading) {

  const e = me.e, roundGames = S.games.filter(g => roundKey(g) === rk), finished = roundGames.length && roundGames.every(g => g.played);
  let total = 0, live = 0, toPlay = 0, done = 0;
  for (const slot of POS) { const c = e.pos[slot], x = c && MT.lines[c]; if (!x) continue;
    if (x.fp != null) total += x.fp * mtMult(slot, e);

        <div class="mt-wcs">${wc("bb", "Bench Boost", "Bench earns 100% instead of 50%")}${wc("tc", "Triple Captain", "Captain earns 300% instead of 200%")}</div>

function mtSwap(a, b) {
  if (a === b) return;
  mtWithEntry(e => { const x = e.pos[a], y = e.pos[b]; if (y) e.pos[a] = y; else delete e.pos[a]; if (x) e.pos[b] = x; else delete e.pos[b]; });

/* ----- drag & drop (mouse: drag; touch: press and hold, then drag) and tap-to-swap ----- */
function mtStartDrag() {
  const pd = MT.pd; if (!pd || MT.drag) return;
  const r = pd.row.getBoundingClientRect(), ghost = pd.row.cloneNode(true);
  ghost.classList.add("mt-ghost"); ghost.classList.remove("selected");
  Object.assign(ghost.style, { width: r.width + "px", left: r.left + "px", top: r.top + "px" });
  document.body.appendChild(ghost);
  pd.row.classList.add("dragging");
  MT.drag = { from: pd.slot, ghost, dx: pd.x - r.left, dy: pd.y - r.top, over: null };
  MT.sel = null; document.body.classList.add("mt-dragging");
  try { navigator.vibrate?.(12); } catch (e) {}
}
function mtMoveDrag(x, y) {
  const g = MT.drag; if (!g) return;
  g.ghost.style.left = (x - g.dx) + "px"; g.ghost.style.top = (y - g.dy) + "px";
  const over = document.elementFromPoint(x, y)?.closest("#mt-board .mt-row");
  if (g.over && g.over !== over) g.over.classList.remove("drop-over");
  if (over && over.dataset.slot !== g.from) over.classList.add("drop-over");
  g.over = over;
  const edge = 70, bottom = innerHeight - (matchMedia("(max-width:760px)").matches ? 140 : 70);
  if (y < edge + 40) window.scrollBy(0, -14); else if (y > bottom) window.scrollBy(0, 14);
}
function mtEndDrag(drop) {
  const g = MT.drag; clearTimeout(MT.pd?.timer); MT.pd = null; if (!g) return;
  g.ghost.remove(); document.body.classList.remove("mt-dragging");
  document.querySelectorAll("#mt-board .dragging,#mt-board .drop-over").forEach(el => el.classList.remove("dragging", "drop-over"));
  MT.drag = null; MT.justDragged = true; setTimeout(() => { MT.justDragged = false; }, 60);
  if (drop && g.over && g.over.dataset.slot) mtSwap(g.from, g.over.dataset.slot); else paintBoard();
}
document.addEventListener("pointerdown", (ev) => {
  const row = ev.target.closest("#mt-board .mt-row[data-code]"); if (!row || ev.button > 0) return;
  MT.pd = { row, slot: row.dataset.slot, x: ev.clientX, y: ev.clientY, mouse: ev.pointerType === "mouse" };
  if (!MT.pd.mouse) MT.pd.timer = setTimeout(mtStartDrag, 280);
});
document.addEventListener("pointermove", (ev) => {
  const pd = MT.pd; if (!pd) return;
  if (MT.drag) { ev.preventDefault(); return mtMoveDrag(ev.clientX, ev.clientY); }
  const dist = Math.hypot(ev.clientX - pd.x, ev.clientY - pd.y);
  if (pd.mouse && dist > 6) { mtStartDrag(); mtMoveDrag(ev.clientX, ev.clientY); }
  else if (!pd.mouse && dist > 10) { clearTimeout(pd.timer); MT.pd = null; }   // finger moved first: it's a scroll
});
document.addEventListener("pointerup", () => { if (MT.drag) mtEndDrag(true); else if (MT.pd) { clearTimeout(MT.pd.timer); MT.pd = null; } });
document.addEventListener("pointercancel", () => { if (MT.drag) mtEndDrag(false); else if (MT.pd) { clearTimeout(MT.pd.timer); MT.pd = null; } });
document.addEventListener("touchmove", (ev) => { if (MT.drag) ev.preventDefault(); }, { passive: false });
document.addEventListener("contextmenu", (ev) => { if (ev.target.closest("#mt-board .mt-row")) ev.preventDefault(); });
document.addEventListener("click", (ev) => {
  const row = ev.target.closest("#mt-board .mt-row"); if (!row || MT.justDragged) return;
  const slot = row.dataset.slot;
  if (MT.sel) { const from = MT.sel; MT.sel = null; if (from === slot) return paintBoard(); return mtSwap(from, slot); }
  if (row.dataset.code) { MT.sel = slot; paintBoard(); }
});

  $("#mt-chosen").innerHTML = MT.draft.length ? `<div class="mt-chips">${MT.draft.map(c => { const p = MT.pl?.find(x => x.code === c);
      return `<span class="mt-chip"><b>${esc(p?.name || mtName(c, d))}</b><small>${esc(p?.team || mtTeamOf(c, d))}</small><button data-mt-del="${esc(c)}" aria-label="Remove">✕</button></span>`; }).join("")}</div>`
    : '<p class="sub" style="margin:0">None yet. Search below and tap players to add them.</p>';
}
function paintResults() {
  if (!$("#mt-results") || !MT.pl) return;
  const q = MT.q.trim().toLowerCase(), chosen = new Set(MT.draft);
  const score = (p) => { const a = S.agg?.get(p.code); return a && a.gp ? a.fp / a.gp : p.pir; };
  const list = MT.pl.filter(p => !q || p.name.toLowerCase().includes(q) || p.raw.toLowerCase().includes(q) || p.team.toLowerCase().includes(q) || (p.teamName || "").toLowerCase().includes(q))
    .sort((a, b) => score(b) - score(a)).slice(0, 40);
  $("#mt-results").innerHTML = list.length ? list.map(p => { const on = chosen.has(p.code), a = S.agg?.get(p.code);
    return `<button class="mt-res ${on ? "taken" : ""}" data-mt-add="${esc(p.code)}" aria-pressed="${on}"><img class="crest" src="${esc(p.crest)}" alt="" loading="lazy" width="24" height="24"><span class="who"><b>${esc(p.name)}</b><small>${esc(p.team)}${a && a.gp ? ` · ${f1(a.fp / a.gp)} FP/game` : ""}</small></span><span class="mt-addb">${on ? "✓ Added" : "+ Add"}</span></button>`; }).join("")
    : '<p class="sub">No players match.</p>';
}
function mtToggle(code) {
  const i = MT.draft.indexOf(code);
  if (i >= 0) MT.draft.splice(i, 1);
  else if (MT.draft.length >= SQUAD_MAX) { $("#mt-msg").textContent = `You already have ${SQUAD_MAX}. Remove one first.`; return; }
  else { MT.draft.push(code); MT.q = ""; if ($("#mt-search")) $("#mt-search").value = ""; }
  $("#mt-msg").textContent = ""; paintChosen(); paintResults();
}
function mtSaveSquad() {
  const d = mtData(), me = mtEntry(d, MT.round);
  const e = me ? me.e : { squad: [], pos: {}, bb: false, tc: false, asked: false };
  e.squad = [...MT.draft]; placeSquad(e);
  for (const c of e.squad) { const p = MT.pl?.find(x => x.code === c); if (p) d.meta[c] = { n: p.name, t: p.team }; }
  d.rounds[MT.round] = e; mtSave(d); closeSheet(); renderMyTeam({ fresh: true });
}

/* ----- backup / move to another phone ----- */
function openTeamBackup() {
  const d = mtData(); openGameCode = null;
  let code = ""; try { code = btoa(unescape(encodeURIComponent(JSON.stringify({ v: 2, season: S.season, d })))); } catch (e) {}
  sheet("Back up My Team", `<section class="card box"><h3>Your team code</h3><p class="sub" style="margin-top:-4px">My Team is saved only on this phone or browser. Copy this code and keep it somewhere (or send it to yourself) to restore it later or on another phone.</p>
      <textarea class="input" id="mt-code" readonly rows="4" style="width:100%;font:12px/1.4 ui-monospace,monospace">${esc(code)}</textarea>
      <div class="row" style="margin-top:10px"><button class="btn primary" data-mt-copy>Copy code</button></div></section>
    <section class="card box"><h3>Restore from a code</h3><p class="sub" style="margin-top:-4px">Paste a team code here. It replaces the team saved on this device for that season.</p>
      <textarea class="input" id="mt-paste" rows="4" style="width:100%;font:12px/1.4 ui-monospace,monospace" placeholder="Paste team code"></textarea>
      <div class="row" style="margin-top:10px"><button class="btn" data-mt-restore>Restore</button><span class="sub" id="mt-rmsg"></span></div></section>`, openTeamBackup);
}
function mtRestore() {
  const raw = ($("#mt-paste")?.value || "").trim(), msg = $("#mt-rmsg");
  try {
    const o = JSON.parse(decodeURIComponent(escape(atob(raw))));
    if (!o || !o.d || !o.d.rounds) throw new Error();
    store.set("myteam:" + o.season, o.d);
    if (o.season !== S.season) { msg.textContent = `Restored for ${seasonLabel(o.season)}.`; return; }
    closeSheet(); renderMyTeam({ fresh: true });
  } catch (e) { msg.textContent = "That code isn't valid. Copy the whole code and try again."; }
}

/* ----- buttons ----- */
document.addEventListener("click", (ev) => {
  const t = ev.target.closest("[data-mt-edit],[data-mt-add],[data-mt-del],[data-mt-save],[data-mt-wc],[data-mt-asked],[data-mtrnav],[data-mt-backup],[data-mt-copy],[data-mt-restore],[data-mt-refresh]");
